[project]
name = "langraph-project-demo-1"
version = "0.1.0"
description = "Agente de terminal con LangGraph, tool calling y LLM mockeado o configurable"
readme = "README.md"
authors = [
    { name = "SimplyVisio", email = "fran_chago@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.21",
]

[project.scripts]
langgraph-demo = "langraph_project_demo_1.main:run"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
